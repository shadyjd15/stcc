# STCC website – production stack
#
#   cp .env.example .env      # fill in the secrets
#   docker compose up -d --build
#
# Optional extras (enable with --profile):
#   tunnel   Cloudflare Tunnel – publish the site through Cloudflare without opening ports
#   backup   nightly PostgreSQL dumps kept for 14 days / 8 weeks / 6 months
#
#   docker compose --profile tunnel --profile backup up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stcc}
      POSTGRES_USER: ${POSTGRES_USER:-stcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stcc} -d ${POSTGRES_DB:-stcc}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://stcc.sa}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: stcc-website:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stcc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stcc}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/app/uploads

  cloudflared:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN to use the tunnel profile}
    depends_on:
      - app

  backup:
    profiles: ['backup']
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-stcc}
      POSTGRES_USER: ${POSTGRES_USER:-stcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

volumes:
  db-data:
  uploads:
